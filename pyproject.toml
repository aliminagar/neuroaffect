[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroaffect"
version = "0.1.0"
description = "Facial affect analysis pipeline: detect → classify → aggregate → evaluate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.1",
    "opencv-python>=4.9,<5.0",
    "Pillow>=10.0,<11.0",
    "mediapipe>=0.10.9,<0.11",
    "transformers>=4.40,<5",
    "torch>=2.2",
    "matplotlib>=3.7,<4",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
neuroaffect = "neuroaffect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that need the mediapipe detector (and, on first run, network to fetch the model)",
]
