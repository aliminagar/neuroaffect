[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroaffect"
version = "0.1.0"
description = "Facial affect analysis pipeline: detect → classify → aggregate → evaluate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.1",
    "opencv-python>=4.9,<5.0",
    "Pillow>=10.0,<11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
neuroaffect = "neuroaffect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
